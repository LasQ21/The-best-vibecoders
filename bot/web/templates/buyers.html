{% from "_macros.html" import titlebar, footer %}
<section class="screen" data-screen="buyers" data-tab="buyers" data-title="Замовники">
  {{ titlebar("Замовники", "Рейтинг за середнім балом", back=True) }}
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" name="q" value="{{ query }}" placeholder="Назва або ЄДРПОУ" autocomplete="off" enterkeyhint="search"
           hx-get="/app/v/buyers?part=list" hx-trigger="input changed delay:350ms, search" hx-target="#buyer-list" aria-label="Пошук замовника">
  </label>
  <div id="buyer-list">{% include "buyer_list.html" %}</div>
  {{ footer() }}
</section>
