# Лише для розгортання Telegram-бота на Vercel.
# Локальний запуск сайту — як і раніше через requirements.txt, бота — через requirements-bot.txt.
# Streamlit тут свідомо немає: функції Vercel він не потрібен, а пакет важить сотні МБ.

[project]
name = "prozorro-radar-bot"
version = "0.1.0"
# Версія Python для функції Vercel. Локально сайт, бот і тести працюють з Python 3.11+ (див. README).
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "plotly==7.1.0",
    "scikit-learn==1.9.1",
    "aiogram==3.32.0",
    "fastapi==0.163.1",
    "jinja2==3.1.6",
    "certifi==2026.10.23",
    "vercel-blob==0.6.0",
]

[tool.vercel]
# app.py у корені — це контракт сайту, не вебзастосунок. Точка входу бота інша.
entrypoint = "bot.vercel_app:app"
